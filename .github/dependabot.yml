version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      otel: { patterns: ["OpenTelemetry*", "Npgsql.OpenTelemetry"] }
      aspire: { patterns: ["Aspire*"] }
    ignore:
      # MCP spec + C# SDK are still moving — review these bumps manually.
      - dependency-name: "ModelContextProtocol*"

  - package-ecosystem: npm
    directory: "/src/Kairos.Web/ClientApp"
    schedule: { interval: weekly }

  - package-ecosystem: npm
    directory: "/tests/e2e"
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: "/src/Kairos.Web"
    schedule: { interval: weekly }
