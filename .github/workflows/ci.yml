name: CI

# Quality gate for pull requests and non-main pushes: lint, type-check, build.
# No secrets needed — the app's Supabase client is created lazily, so `next build`
# succeeds without any environment variables.

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `next build` type-checks the whole app (and generates next-env.d.ts), so it
      # is the authoritative type gate — no separate `tsc` step needed.
      - run: npm run build
