name: Deploy

# Production deploys happen ONLY from GitHub Actions. All credentials for Supabase
# and Vercel live in this repo's GitHub Actions secrets — nothing sensitive is in
# the codebase. See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    # Docs/memory-only changes don't need a redeploy. Use the Run workflow button
    # (workflow_dispatch) to force a deploy regardless.
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1) Apply any new database migrations to the Supabase project.
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pre-flight safety gate. A bad migration is the only way the `migrate` job
      # could ever drop a user's data, so we refuse to deploy if anyone slipped a
      # destructive statement into supabase/migrations/ without explicitly opting
      # in. To run a destructive migration intentionally, add a line of the form
      #   -- SAFETY: destructive (reason: <one-line justification>)
      # to that migration file. The grep below ignores commented-out occurrences.
      - name: Guard against destructive SQL in migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files. Skipping guard."
            exit 0
          fi
          # Strip line comments before scanning, so banned keywords inside `--`
          # comments don't trip the guard.
          banned='\b(drop[[:space:]]+(table|schema|database|owned|type|function|view|materialized[[:space:]]+view|index|extension|policy|trigger|role)|truncate|delete[[:space:]]+from|alter[[:space:]]+table[[:space:]]+[^;]*drop[[:space:]]+(column|constraint))\b'
          failed=0
          for f in "${files[@]}"; do
            scrubbed=$(sed -E 's/--.*$//' "$f")
            if echo "$scrubbed" | grep -Eiq "$banned"; then
              if grep -Eiq '^\s*--\s*SAFETY:\s*destructive\b' "$f"; then
                echo "::warning file=$f::Destructive SQL present but opted in via SAFETY annotation."
              else
                echo "::error file=$f::Destructive SQL detected (DROP/TRUNCATE/DELETE FROM/ALTER … DROP). Add a '-- SAFETY: destructive (reason: …)' line at the top of the file if this is intentional."
                failed=1
              fi
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Refusing to deploy: destructive migration without explicit SAFETY opt-in."
            exit 1
          fi
          echo "Migration safety guard passed (${#files[@]} file(s) scanned)."

      - uses: supabase/setup-cli@v2
        with:
          # Pin an exact version: `latest` resolves via the GitHub API and gets
          # rate-limited on frequent runs ("Failed to resolve latest ... rate limit").
          version: 2.101.0

      - name: Push migrations to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # Log first so a future "where did my data go" question is answerable
          # from the Actions log — dry-run prints which migrations would apply
          # without touching the DB. `-y` keeps it non-interactive.
          echo "── Pending migrations (dry run) ─────────────────────────"
          supabase db push --dry-run --linked || true
          echo "── Applying migrations ──────────────────────────────────"
          # NOTE: we deliberately do NOT pass --include-seed or --include-roles.
          # seed.sql is for local `supabase db reset` only — never for prod.
          # `--yes` is the global non-interactive flag (the old `-y` shorthand was
          # removed in supabase CLI v2; only --yes is accepted now).
          supabase db push --linked --yes

  # 2) Build and deploy the Next.js app to Vercel (production).
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings & env
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy (prebuilt) to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
