# Kairos — FULL local dev stack (app + Postgres + reverse proxy + obs + dashboard).
# Mirrors the Aspire AppHost contract exactly: service names, ports, db name, OTLP endpoint.
# `aspire publish` regenerates a base docker-compose.yml; this curated file is the dev variant.
#
#   docker compose -f compose.dev.yml config        # validate first
#   docker compose -f compose.dev.yml up --build
name: kairos-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kairosdb
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
    volumes:
      - kairos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairosdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [kairos]

  # Dev-only Postgres admin UI.
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@kairos.local
      PGADMIN_DEFAULT_PASSWORD: kairos
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports: ["5050:80"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [kairos]

  web:
    build:
      context: .
      dockerfile: src/Kairos.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__kairosdb: "Host=postgres;Database=kairosdb;Username=kairos;Password=kairos;Max Auto Prepare=20;Auto Prepare Min Usages=2"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      # Caddy reverse-proxies via h2c (HTTP/2 cleartext). Over plaintext Kestrel only speaks
      # HTTP/2 when the endpoint is Http2-only (no ALPN to negotiate) — otherwise Caddy gets 502.
      Kestrel__EndpointDefaults__Protocols: "Http2"
    volumes:
      - dpkeys:/keys          # Data Protection keys (OAuth tokens encrypted at rest)
      - kairos_files:/files   # future attachments
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/alive || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [kairos]

  caddy:
    image: caddy:2
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    # 443 is the real entry point (https://localhost). Host 80 is taken by Windows http.sys,
    # so the HTTP→HTTPS redirect is published on 8080 instead (http://localhost:8080).
    ports: ["443:443", "8080:80"]
    depends_on: [web]
    networks: [kairos]

  # ── Dev-only observability stack ─────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.dev.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318", "8889:8889"]
    depends_on: [tempo, loki]
    networks: [kairos]

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [kairos]

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports: ["3100:3100"]
    networks: [kairos]

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports: ["3200:3200"]
    networks: [kairos]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: kairos
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]
    networks: [kairos]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://kairos:kairos@postgres:5432/kairosdb?sslmode=disable"
    ports: ["9187:9187"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [kairos]

volumes:
  kairos_pgdata: {}
  dpkeys: {}
  kairos_files: {}
  caddy_data: {}
  prometheus_data: {}
  loki_data: {}
  tempo_data: {}
  grafana_data: {}

networks:
  kairos: {}
