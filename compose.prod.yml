# Kairos — single-user PROD stack (app + Postgres + reverse proxy + minimal OTel-to-disk).
# NO Grafana/Loki/Tempo, NO Aspire Dashboard — those are dev-only.
# Mirrors the Aspire AppHost contract exactly (names, ports, db name, OTLP endpoint).
#
#   docker compose -f compose.prod.yml up --build
name: kairos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kairosdb
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
    volumes:
      - kairos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairosdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [kairos]

  web:
    build:
      context: .
      dockerfile: src/Kairos.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__kairosdb: "Host=postgres;Database=kairosdb;Username=kairos;Password=kairos;Max Auto Prepare=20;Auto Prepare Min Usages=2"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      # Caddy reverse-proxies via h2c (HTTP/2 cleartext). Over plaintext Kestrel only speaks
      # HTTP/2 when the endpoint is Http2-only (no ALPN to negotiate) — otherwise Caddy gets 502.
      Kestrel__EndpointDefaults__Protocols: "Http2"
    volumes:
      - dpkeys:/keys          # Data Protection keys (OAuth tokens encrypted at rest)
      - kairos_files:/files
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 512m           # NFR: steady-state ≤ 300 MB RSS
    networks: [kairos]

  caddy:
    image: caddy:2
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    ports: ["443:443", "80:80"]
    depends_on: [web]
    networks: [kairos]

  # ── Pared-down OTel pipeline: metrics → local Prometheus, logs → file. No Grafana/Loki/Tempo. ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.prod.yaml:/etc/otelcol/config.yaml:ro
      - kairos_otel_logs:/var/log/kairos
    networks: [kairos]

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [kairos]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://kairos:kairos@postgres:5432/kairosdb?sslmode=disable"
    depends_on: { postgres: { condition: service_healthy } }
    networks: [kairos]

volumes:
  kairos_pgdata: {}
  dpkeys: {}
  kairos_files: {}
  caddy_data: {}
  prometheus_data: {}
  kairos_otel_logs: {}

networks:
  kairos: {}
