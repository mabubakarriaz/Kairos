# OTel Collector — PROD (single-user): pared down. Metrics → local Prometheus; logs → file.
# NO Tempo/Loki/Grafana — a full obs stack can out-consume the app on one machine.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  file/logs:
    path: /var/log/kairos/otel-logs.jsonl

service:
  pipelines:
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus] }
    logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [file/logs] }
    # traces pipeline intentionally dropped in prod.
