global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]   # Collector's Prometheus exporter (app + Kairos custom metrics)

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"] # pg_stat_statements, connections, etc.
